name: Build Check

on:
  push:
    branches: [main, codex/security-authentication-repair]
  pull_request:
    branches: [main, codex/verified-crm-audit]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static validation
        run: node scripts/validate.js

      - name: API syntax checks
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        run: npm test
        env:
          OAUTH_STATE_SECRET: test-only-oauth-state-secret-32-bytes
          CRON_SECRET: test-only-cron-secret-32-bytes-value
          UNSUB_SECRET: test-only-unsub-secret-32-bytes
          APP_ORIGINS: https://app.example.test
          PUBLIC_BASE_URL: https://app.example.test
          TWILIO_AUTH_TOKEN: test-only-twilio-token-32-bytes

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://sgrnyvdsyahmypibjarx.supabase.co
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      - name: Smoke checks
        run: npm run smoke

      - name: Render smoke checks
        run: npm run render-smoke
